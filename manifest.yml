modules:
  rovo:agent:
    - key: config-doctor-agent
      name: Config Doctor
      description: Explains Jira access and configuration problems with deterministic, auditable evidence.
      prompt: resource:agent-resources;prompt.md
      conversationStarters:
        - Why can't Emma Paris see PAY-3?
        - Who can see PAY-3 and why?
        - How healthy is our Jira configuration?
        - What happens if I remove group cd-contractors-2024?
        - Is Config Doctor working on this site?
      actions:
        - ping-jira
        - explain-access
        - list-who-can-see
        - run-sprawl-audit
        - list-findings
        - preview-change-impact
        - preview-cleanup-plan
        - create-cleanup-plan
  action:
    - key: ping-jira
      name: Check Config Doctor connection
      function: pingJira
      actionVerb: GET
      description: >
        Health check. Returns the Jira site's server info and the invoking user's accountId and
        whether they are a Jira administrator. Use when the user asks if Config Doctor works,
        who they are, or whether they are an admin.
      inputs:
        note:
          title: Note
          type: string
          required: false
          description: Optional free text from the user. Pass the word probe only when the user explicitly asks for an endpoint probe.
    - key: explain-access
      name: Explain a user's access
      function: explainAccess
      actionVerb: GET
      description: >
        Explains if a person can see or act on a Jira issue or project and why: verdict, evidence chain
        (scheme grants, roles, groups, security level), fix options with blast radius, and Jira's own
        check. For "Why can't Linh see PROJ-123?".
      inputs:
        user:
          title: User
          type: string
          required: true
          description: The person the question is about, as written by the user (display name, email or account ID). Use "me" if they ask about themselves.
        issueKey:
          title: Issue or project key
          type: string
          required: true
          description: The Jira issue key (e.g. PAY-3) or, for project-level questions, the project key (e.g. PAY).
        permission:
          title: Permission
          type: string
          required: false
          description: What they want to do, e.g. see, edit, transition, comment, create, or a Jira permission key like EDIT_ISSUES. Omit for "see".
    - key: list-who-can-see
      name: List who can see an issue
      function: whoCanSee
      actionVerb: GET
      description: >
        Lists everyone who can see a Jira issue and the path giving each person access (group, role,
        reporter, lead) after the issue security level, compared with Jira's own list. For "Who can
        see PROJ-123?".
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, e.g. PAY-3.
    - key: run-sprawl-audit
      name: Run configuration sprawl audit
      function: sprawlAudit
      actionVerb: GET
      description: >
        Jira configuration health score (0-100) with breakdown, trend and ranked findings: duplicate or
        unused custom fields, empty or unused groups, unused schemes, inactive workflows, unused screens.
      inputs:
        scope:
          title: Scope
          type: string
          required: false
          description: Optional. Only "site" is supported.
    - key: list-findings
      name: List audit findings by category
      function: listFindings
      actionVerb: GET
      description: >
        Lists all findings of one category from the latest configuration scan, e.g. duplicate fields, fields
        not on screens, unused fields, empty groups, unused schemes, inactive workflows, unused screens.
      inputs:
        category:
          title: Category
          type: string
          required: true
          description: What to list, e.g. "duplicate fields", "groups", "permission schemes", "workflows", "screens".
        nameContains:
          title: Name contains
          type: string
          required: false
          description: Optional text to narrow the list by object name.
    - key: preview-change-impact
      name: Preview a configuration change
      function: changeImpact
      actionVerb: GET
      description: >
        Read-only simulation of a change before an admin makes it: remove a group, delete a custom field, or
        switch a project's permission scheme. Returns who loses or gains access, references and risk.
      inputs:
        changeType:
          title: Change type
          type: string
          required: true
          description: One of remove-group, delete-field, switch-permission-scheme.
        target:
          title: Target
          type: string
          required: true
          description: The group name, the custom field name or id, or (for a scheme switch) the project key.
        newScheme:
          title: New permission scheme
          type: string
          required: false
          description: For switch-permission-scheme only, the name or id of the scheme the project would switch to.
    - key: preview-cleanup-plan
      name: Preview a cleanup plan
      function: previewCleanupPlan
      actionVerb: GET
      description: >
        Step 1 of 2. Shows the Jira issues (one epic and one task per finding) that a cleanup plan would
        create in a project, without creating anything, and returns a one-time confirmToken.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Key of the project where the cleanup issues should be created, e.g. PAY.
        findingIds:
          title: Finding IDs
          type: string
          required: false
          description: Comma-separated finding ids from the audit (e.g. "GEG-1x2y, FDN-9k"). Omit for the top 10 findings.
    - key: create-cleanup-plan
      name: Create the confirmed cleanup plan
      function: createCleanupPlan
      actionVerb: CREATE
      description: >
        Step 2 of 2. Creates the cleanup plan issues previewed by preview-cleanup-plan. Only call after the
        user explicitly confirmed the preview in this conversation.
      inputs:
        confirmToken:
          title: Confirmation token
          type: string
          required: true
          description: The confirmToken returned by preview-cleanup-plan.
  consumer:
    - key: scan-consumer
      queue: scan-queue
      function: scanWorker
  scheduledTrigger:
    - key: weekly-sprawl-scan
      function: weeklyScan
      interval: week
  function:
    - key: sprawlAudit
      handler: index.sprawlAudit
    - key: listFindings
      handler: index.listFindings
    - key: changeImpact
      handler: index.changeImpact
    - key: previewCleanupPlan
      handler: index.previewCleanupPlan
    - key: createCleanupPlan
      handler: index.createCleanupPlan
    - key: scanWorker
      handler: index.scanWorker
      timeoutSeconds: 600
    - key: weeklyScan
      handler: index.weeklyScan
    - key: pingJira
      handler: index.pingJira
    - key: explainAccess
      handler: index.explainAccess
    - key: whoCanSee
      handler: index.whoCanSee
resources:
  - key: agent-resources
    path: agent
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
    - manage:jira-project
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/9e634caf-091b-4ebc-9529-c0b895d818b8
